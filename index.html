<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070913">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Nexus Word Matrix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070913;
      --panel-bg: rgba(18, 24, 46, 0.88);
      --panel-border: rgba(99, 102, 241, 0.38);
      --accent-cyan: #00f0ff;
      --accent-gold: #fbbf24;
      --accent-magenta: #f43f5e;
      --text-glow: 0 0 14px rgba(0, 240, 255, 0.8);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      touch-action: manipulation;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 5%, rgba(99, 102, 241, 0.28) 0%, transparent 45%),
        radial-gradient(circle at 85% 70%, rgba(244, 63, 94, 0.16) 0%, transparent 40%),
        radial-gradient(circle at 15% 85%, rgba(0, 240, 255, 0.16) 0%, transparent 40%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      padding: 10px 12px 20px 12px;
      overflow-x: hidden;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      pointer-events: none;
      z-index: 0;
    }

    /* ================= DASHBOARD HUD ================= */
    .dashboard-header {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 430px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .stat-group {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .stat-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
    }

    .stat-badge.level { color: #a5b4fc; border-color: rgba(99, 102, 241, 0.5); }
    .stat-badge.score { color: var(--accent-cyan); }
    .stat-badge.coins { color: var(--accent-gold); }
    .stat-badge.streak { color: #f97316; }

    .hud-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .hud-btn:active { transform: scale(0.9); }

    /* ================= KOTAK JAWABAN ================= */
    .target-wrapper {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 2px;
      width: 100%;
    }

    .target-container {
      display: flex;
      gap: 6px;
      justify-content: center;
      align-items: center;
      padding: 4px;
      max-width: 100%;
    }

    .slot {
      border-radius: 12px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.1), rgba(0, 0, 0, 0.55));
      border: 2px solid rgba(99, 102, 241, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      box-shadow: 0 4px 14px rgba(0,0,0,0.55), inset 0 2px 2px rgba(255,255,255,0.15);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .slot.filled {
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.7), inset 0 2px 4px rgba(255,255,255,0.5);
      transform: translateY(-2px) scale(1.05);
      color: #ffffff;
    }

    .slot.shake {
      animation: slotShake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
      border-color: var(--accent-magenta);
      background: rgba(244, 63, 94, 0.3);
    }

    .preview-pill {
      height: 32px;
      min-width: 120px;
      padding: 0 16px;
      margin-top: 6px;
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(0, 240, 255, 0.5);
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--accent-cyan);
      text-shadow: var(--text-glow);
      opacity: 0;
      transform: scale(0.85);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .preview-pill.active {
      opacity: 1;
      transform: scale(1);
    }

    /* ================= WHEEL ARENA ================= */
    .wheel-main-layout {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      max-width: 430px;
      margin-top: 4px;
    }

    .wheel-container {
      position: relative;
      width: 250px;
      height: 250px;
      touch-action: none;
      flex-shrink: 0;
    }

    .wheel-disc {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(30, 41, 59, 0.9) 0%, rgba(15, 23, 42, 0.98) 70%, rgba(10, 15, 30, 1) 100%);
      border: 2px solid rgba(99, 102, 241, 0.4);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.75), inset 0 0 30px rgba(0, 240, 255, 0.1);
    }

    .wheel-core {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 48px;
      height: 48px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.3), rgba(0, 240, 255, 0.15));
      border: 1px solid rgba(0, 240, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .wheel-core svg { width: 20px; height: 20px; fill: rgba(0, 240, 255, 0.8); }

    canvas#laserCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    .letter-node {
      position: absolute;
      border-radius: 50%;
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 2px solid rgba(255, 255, 255, 0.25);
      color: #f8fafc;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translate(-50%, -50%);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.55), inset 0 1px 2px rgba(255, 255, 255, 0.25);
      z-index: 10;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s, border-color 0.2s;
    }

    .letter-node.active {
      background: linear-gradient(135deg, #00f0ff, #3b82f6);
      color: #030712;
      border-color: #ffffff;
      transform: translate(-50%, -50%) scale(1.18);
      box-shadow: 0 0 24px rgba(0, 240, 255, 0.95), inset 0 2px 4px rgba(255,255,255,0.7);
    }

    /* ================= TOMBOL DI BAWAH LINGKARAN ================= */
    .bottom-controls-bar {
      display: flex;
      gap: 16px;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 320px;
      margin-top: 4px;
    }

    .bottom-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.92), rgba(15, 23, 42, 0.98));
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      color: #f1f5f9;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
      transition: transform 0.15s, border-color 0.15s;
    }
    .bottom-btn:active {
      transform: scale(0.93);
      border-color: var(--accent-cyan);
    }
    .bottom-btn svg { width: 20px; height: 20px; fill: currentColor; }
    .bottom-btn .btn-text { font-size: 13px; font-weight: 800; letter-spacing: 0.8px; }
    .bottom-btn .cost-badge {
      font-size: 11px;
      color: var(--accent-gold);
      font-weight: 800;
      background: rgba(251, 191, 36, 0.18);
      padding: 2px 6px;
      border-radius: 8px;
    }

    /* ================= KREDIT TIKTOK ================= */
    .creator-credit-box {
      margin-top: 12px;
      padding: 6px 18px;
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.85);
      border: 1.5px solid rgba(0, 240, 255, 0.45);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
      font-size: 12px;
      color: #cbd5e1;
      letter-spacing: 0.5px;
      text-align: center;
    }
    .creator-credit-box strong {
      color: var(--accent-cyan);
      font-weight: 900;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
    }

    /* ================= MODAL & POPUP SISTEM ================= */
    .modal-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, rgba(15, 23, 42, 0.92) 0%, rgba(7, 9, 19, 0.98) 100%);
      backdrop-filter: blur(10px);
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }
    .modal-overlay.show { opacity: 1; pointer-events: auto; }
    
    .modal-card {
      background: rgba(30, 41, 59, 0.96);
      border: 1px solid var(--panel-border);
      padding: 24px 20px;
      border-radius: 20px;
      text-align: center;
      max-width: 320px;
      width: 100%;
      transform: scale(0.8);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.75);
    }
    .modal-overlay.show .modal-card { transform: scale(1); }

    .modal-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #00f0ff, #facc15);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .modal-desc { font-size: 13px; color: #cbd5e1; line-height: 1.5; margin-bottom: 16px; }

    .modal-btn {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #4f46e5, #00f0ff);
      color: #030712;
      font-weight: 900;
      font-size: 14px;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 240, 255, 0.45);
      transition: transform 0.15s;
    }
    .modal-btn:active { transform: scale(0.96); }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 99;
    }

    @keyframes slotShake {
      10%, 90% { transform: translate3d(-3px, 0, 0); }
      20%, 80% { transform: translate3d(5px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }
  </style>
</head>

      "valuta", "versi", "visi", "vokal", "vonis", "wadah", "waduk", "wajah", "wajan", "wajar",
      "wajib", "waktu", "walet", "wangi", "wanita", "warna", "warung", "wasiat", "watak", "wayang",
      "wesel", "wortel", "yakin", "yakni", "yang", "yatim", "yodium", "yoga", "zaman", "zona"
    ];

    const words4 = rawWordDatabase.filter(w => w.length === 4).map(w => w.toUpperCase());
    const words5 = rawWordDatabase.filter(w => w.length === 5).map(w => w.toUpperCase());
    const words6 = rawWordDatabase.filter(w => w.length === 6).map(w => w.toUpperCase());

    /* ================= 2. AUDIO SYNTHESIZER ================= */
    let soundEnabled = true;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function triggerHaptic(pattern = 20) {
      if (navigator.vibrate) {
        try { navigator.vibrate(pattern); } catch (e) {}
      }
    }

    function playTone(freq, type = 'sine', duration = 0.14, gainLvl = 0.45) {
      if (!soundEnabled) return;
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainLvl, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playVictoryChord() {
      if (!soundEnabled) return;
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
        setTimeout(() => playTone(freq, 'triangle', 0.5, 0.55), idx * 75);
      });
    }

    function playErrorSound() {
      if (!soundEnabled) return;
      playTone(160, 'sawtooth', 0.22, 0.45);
      setTimeout(() => playTone(120, 'sawtooth', 0.26, 0.45), 80);
    }

    /* ================= 3. STATE & LOCAL STORAGE ================= */
    const STORAGE_KEY = "NEXUS_WORD_SAVE_DATA_V6";
    let gameState = {
      level: 1,
      score: 0,
      streak: 0,
      coins: 350,
      sound: true,
      lastDate: ""
    };

    function loadSavedGame() {
      const data = localStorage.getItem(STORAGE_KEY);
      if (data) {
        try {
          gameState = { ...gameState, ...JSON.parse(data) };
        } catch(e) {}
      }
      soundEnabled = gameState.sound;
      updateHeaderHUD();
      checkDailyBonus();
    }

    function saveGame() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(gameState));
    }

    function updateHeaderHUD() {
      document.getElementById('levelLabel').innerText = `LV. ${gameState.level}`;
      document.getElementById('scoreVal').innerText = gameState.score;
      document.getElementById('streakVal').innerText = gameState.streak;
      document.getElementById('coinVal').innerText = gameState.coins;
      document.getElementById('soundToggle').style.opacity = soundEnabled ? '1' : '0.4';
    }

    function checkDailyBonus() {
      const today = new Date().toISOString().slice(0, 10);
      if (gameState.lastDate !== today) {
        setTimeout(() => {
          document.getElementById('dailyRewardOverlay').classList.add('show');
        }, 600);
      }
    }

    document.getElementById('claimDailyBtn').addEventListener('click', () => {
      const today = new Date().toISOString().slice(0, 10);
      gameState.lastDate = today;
      gameState.coins += 100;
      saveGame();
      updateHeaderHUD();
      playVictoryChord();
      launchConfetti();
      document.getElementById('dailyRewardOverlay').classList.remove('show');
    });

    /* ================= 4. GENERATOR SOAL (HANYA 3 KECOHAN) ================= */
    const commonTrapLetters = ["A", "E", "I", "U", "O", "R", "S", "T", "N", "K", "M", "L", "B", "P", "D"];

    function generateRandomStage() {
      const lengths = [4, 5, 6];
      const chosenLength = lengths[Math.floor(Math.random() * lengths.length)];

      let pool = words4;
      if (chosenLength === 5) pool = words5;
      else if (chosenLength === 6) pool = words6;

      const targetWord = pool[Math.floor(Math.random() * pool.length)];
      const targetLetters = targetWord.split('');
      const distractors = [];

      // Tepat 3 huruf kecohan
      const distractorCount = 3;

      // 1. Ambil 1 huruf kembar dari target
      const randomTargetChar = targetLetters[Math.floor(Math.random() * targetLetters.length)];
      distractors.push(randomTargetChar);

      // 2. Ambil 2 huruf jebakan
      while (distractors.length < distractorCount) {
        const trap = commonTrapLetters[Math.floor(Math.random() * commonTrapLetters.length)];
        distractors.push(trap);
      }

      return {
        answer: targetWord,
        distractors: distractors
      };
    }

    /* ================= 5. LOGIKA WHEEL ================= */
    let currentStageData = null;
    let selectedNodes = [];
    let isDragging = false;
    let pointerPos = { x: 0, y: 0 };
    let activeLettersPool = [];
    let currentHitRadius = 26;

    const wheel = document.getElementById('wheel');
    const laserCanvas = document.getElementById('laserCanvas');
    const ctx = laserCanvas.getContext('2d');
    const targetContainer = document.getElementById('targetContainer');
    const previewPill = document.getElementById('previewPill');
    const celebrationOverlay = document.getElementById('celebrationOverlay');
    const celebrationTitle = document.getElementById('celebrationTitle');

    function resizeCanvas() {
      const dpr = Math.max(window.devicePixelRatio || 1, 2);
      laserCanvas.width = wheel.clientWidth * dpr;
      laserCanvas.height = wheel.clientHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resizeCanvas);

    function startLevel() {
      currentStageData = generateRandomStage();
      const wordLen = currentStageData.answer.length;
      selectedNodes = [];
      previewPill.innerText = "";
      previewPill.classList.remove('active');

      targetContainer.innerHTML = '';
      let boxW = 48, boxH = 54, fontSize = 23;
      if (wordLen === 5) { boxW = 42; boxH = 48; fontSize = 20; }
      else if (wordLen === 6) { boxW = 36; boxH = 42; fontSize = 18; }

      for (let i = 0; i < wordLen; i++) {
        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.style.width = `${boxW}px`;
        slot.style.height = `${boxH}px`;
        slot.style.fontSize = `${fontSize}px`;
        targetContainer.appendChild(slot);
      }

      // Total hanya 7, 8, atau 9 huruf
      activeLettersPool = [...currentStageData.answer.split(''), ...currentStageData.distractors];
      shuffleLetters(activeLettersPool);
      spawnWheelNodes(activeLettersPool);
      drawLaser();
    }

    function shuffleLetters(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    function spawnWheelNodes(letters) {
      const oldNodes = wheel.querySelectorAll('.letter-node');
      oldNodes.forEach(n => n.remove());

      const count = letters.length;
      const radius = 94;
      const centerX = wheel.clientWidth / 2;
      const centerY = wheel.clientHeight / 2;

      let nodeSize = 46, nodeFont = 22;
      currentHitRadius = 26;

      if (count === 9) {
        nodeSize = 42;
        nodeFont = 19;
        currentHitRadius = 24;
      }

      letters.forEach((char, i) => {
        const angle = (i / count) * 2 * Math.PI - (Math.PI / 2);
        const x = centerX + radius * Math.cos(angle);
        const y = centerY + radius * Math.sin(angle);

        const node = document.createElement('div');
        node.className = 'letter-node';
        node.innerText = char;
        node.style.width = `${nodeSize}px`;
        node.style.height = `${nodeSize}px`;
        node.style.fontSize = `${nodeFont}px`;
        node.style.left = `${x}px`;
        node.style.top = `${y}px`;
        node.dataset.char = char;
        wheel.appendChild(node);
      });
    }

    function drawLaser() {
      ctx.clearRect(0, 0, wheel.clientWidth, wheel.clientHeight);
      if (selectedNodes.length === 0) return;

      ctx.beginPath();
      ctx.lineWidth = 8;
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.4)';
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      selectedNodes.forEach((node, idx) => {
        const x = parseFloat(node.style.left);
        const y = parseFloat(node.style.top);
        if (idx === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      if (isDragging) ctx.lineTo(pointerPos.x, pointerPos.y);
      ctx.stroke();

      ctx.beginPath();
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = '#ffffff';
      selectedNodes.forEach((node, idx) => {
        const x = parseFloat(node.style.left);
        const y = parseFloat(node.style.top);
        if (idx === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      if (isDragging) ctx.lineTo(pointerPos.x, pointerPos.y);
      ctx.stroke();
    }

    /* ================= 6. SENTUHAN & GESTUR ================= */
    wheel.addEventListener('pointerdown', (e) => {
      initAudio();
      isDragging = true;
      updatePointer(e);
      detectLetter(e.clientX, e.clientY);
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      updatePointer(e);
      detectLetter(e.clientX, e.clientY);
      drawLaser();
    });

    window.addEventListener('pointerup', () => {
      if (!isDragging) return;
      isDragging = false;
      evaluateAnswer();
      drawLaser();
    });

    function updatePointer(e) {
      const rect = wheel.getBoundingClientRect();
      pointerPos.x = e.clientX - rect.left;
      pointerPos.y = e.clientY - rect.top;
    }

    function detectLetter(clientX, clientY) {
      const nodes = wheel.querySelectorAll('.letter-node');
      nodes.forEach(node => {
        const rect = node.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dist = Math.hypot(clientX - cx, clientY - cy);

        if (dist < currentHitRadius && !selectedNodes.includes(node)) {
          selectedNodes.push(node);
          node.classList.add('active');
          triggerHaptic(20);
          playTone(400 + (selectedNodes.length * 85), 'sine', 0.15, 0.45);
          syncPreview();
        }
      });
    }

    function syncPreview() {
      const word = selectedNodes.map(n => n.dataset.char).join('');
      if (word.length > 0) {
        previewPill.innerText = word;
        previewPill.classList.add('active');
      } else {
        previewPill.classList.remove('active');
      }
    }

    /* ================= 7. VALIDASI & SELEBRASI ================= */
    const kataPujian = ["SEMPURNA!", "LUAR BIASA!", "HEBAT SEKALI!", "SANGAT CERDAS!", "KERJA BAGUS!"];

    function triggerWinCelebration() {
      triggerHaptic([30, 50, 40]);
      gameState.score += 150;
      gameState.streak += 1;
      gameState.coins += 30;
      updateHeaderHUD();
      saveGame();

      playVictoryChord();
      celebrationTitle.innerText = kataPujian[Math.floor(Math.random() * kataPujian.length)];
      celebrationOverlay.classList.add('show');
      launchConfetti();
    }

    function evaluateAnswer() {
      const word = selectedNodes.map(n => n.dataset.char).join('');
      const target = currentStageData.answer;

      if (word === target) {
        const slots = targetContainer.querySelectorAll('.slot');
        slots.forEach((s, idx) => {
          s.innerText = target[idx];
          s.classList.add('filled');
        });
        triggerWinCelebration();
      } else {
        if (word.length > 0) {
          triggerHaptic(60);
          playErrorSound();
          gameState.streak = 0;
          updateHeaderHUD();
          saveGame();

          const slots = targetContainer.querySelectorAll('.slot');
          slots.forEach(s => {
            s.classList.add('shake');
            setTimeout(() => s.classList.remove('shake'), 450);
          });
        }
        cleanupSelection();
      }
    }

    function cleanupSelection() {
      previewPill.classList.remove('active');
      selectedNodes.forEach(n => n.classList.remove('active'));
      selectedNodes = [];
    }

    document.getElementById('nextLevelBtn').addEventListener('click', () => {
      celebrationOverlay.classList.remove('show');
      gameState.level += 1;
      updateHeaderHUD();
      saveGame();
      startLevel();
    });

    /* ================= 8. ACAK & BANTUAN ================= */
    document.getElementById('shuffleBtn').addEventListener('click', () => {
      triggerHaptic(25);
      playTone(550, 'triangle', 0.12, 0.45);
      shuffleLetters(activeLettersPool);
      spawnWheelNodes(activeLettersPool);
    });

    document.getElementById('hintBtn').addEventListener('click', () => {
      if (gameState.coins >= 50) {
        const slots = targetContainer.querySelectorAll('.slot');
        const emptyIndices = [];
        slots.forEach((s, i) => { if (!s.innerText.trim()) emptyIndices.push(i); });

        if (emptyIndices.length > 0) {
          gameState.coins -= 50;
          updateHeaderHUD();
          saveGame();
          triggerHaptic(30);

          const hintIndex = emptyIndices[0];
          slots[hintIndex].innerText = currentStageData.answer[hintIndex];
          slots[hintIndex].classList.add('filled');
          playTone(880, 'sine', 0.25, 0.5);

          const remainingEmpty = [...slots].filter(s => !s.innerText.trim());
          if (remainingEmpty.length === 0) {
            setTimeout(() => {
              triggerWinCelebration();
            }, 300);
          }
        }
      } else {
        triggerHaptic(60);
        playErrorSound();
      }
    });

    const soundToggle = document.getElementById('soundToggle');
    soundToggle.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      gameState.sound = soundEnabled;
      saveGame();
      soundToggle.style.opacity = soundEnabled ? '1' : '0.4';
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      if (confirm("Mulai ulang progres ke Level 1? Koin dan skor Anda tetap aman.")) {
        gameState.level = 1;
        gameState.streak = 0;
        updateHeaderHUD();
        saveGame();
        startLevel();
      }
    });

    /* ================= 9. SISTEM KONFETI HD ================= */
    const confCanvas = document.getElementById('confettiCanvas');
    const confCtx = confCanvas.getContext('2d');
    let confetti = [];
    let isConfettiActive = false;

    function resizeConfetti() {
      const dpr = Math.max(window.devicePixelRatio || 1, 2);
      confCanvas.width = window.innerWidth * dpr;
      confCanvas.height = window.innerHeight * dpr;
      confCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resizeConfetti);
    resizeConfetti();

    function launchConfetti() {
      confetti = [];
      const colors = ['#00f0ff', '#fbbf24', '#f43f5e', '#a855f7', '#38bdf8', '#ffffff'];
      for (let i = 0; i < 90; i++) {
        confetti.push({
          x: window.innerWidth / 2,
          y: window.innerHeight / 2,
          vx: (Math.random() - 0.5) * 18,
          vy: (Math.random() - 0.85) * 18,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          tilt: Math.random() * 10,
          tiltAngle: 0,
          tiltAngleInc: (Math.random() * 0.07) + 0.05,
          alpha: 1
        });
      }
      isConfettiActive = true;
    }

    function renderConfetti() {
      if (isConfettiActive) {
        confCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        confetti.forEach((p, idx) => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.35;
          p.tiltAngle += p.tiltAngleInc;
          p.tilt = Math.sin(p.tiltAngle) * 12;
          p.alpha -= 0.015;

          confCtx.fillStyle = p.color;
          confCtx.globalAlpha = Math.max(0, p.alpha);
          confCtx.beginPath();
          confCtx.rect(p.x + p.tilt, p.y, p.size, p.size * 0.6);
          confCtx.fill();

          if (p.alpha <= 0) confetti.splice(idx, 1);
        });

        if (confetti.length === 0) {
          isConfettiActive = false;
          confCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        }
      }
      requestAnimationFrame(renderConfetti);
    }
    renderConfetti();

    resizeCanvas();
    loadSavedGame();
    startLevel();
  </script>
</body>
</html>
